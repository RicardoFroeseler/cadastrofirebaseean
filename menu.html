<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal - Coletor de Dados</title>
    <!-- Link para o Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="./assets/styles/menu.css">

    <!-- Cor da barra de navegação no Android (Chrome) -->
    <meta name="theme-color" content="#ff7300">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Link para SheetJS (se necessário para outro formato no futuro) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>

    <!-- Firebase e Firestore -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="firebaseConfig.js"></script> <!-- Certifique-se de carregar sua configuração Firebase aqui -->

</head>

<body>
    <div class="container">
        <h1>Menu Principal</h1>
        <p>Versão 3.8</p>
        <div class="menu-grid">
            <a href="cadastro.html" class="menu-item">
                <i class="fa-solid fa-qrcode"></i> <!-- Ícone para Novo Cadastro -->
                <span>Novo Cadastro</span>
            </a>
            <a href="lista.html" class="menu-item">
                <i class="fa-solid fa-pen-to-square"></i> <!-- Ícone para Editar/Deletar Cadastro -->
                <span>Editar/Deletar Cadastro</span>
            </a>

            <!-- Botão para baixar o JSON -->
            <button id="download-json" class="menu-item">
                <i class="fa-solid fa-file-download"></i> <!-- Ícone para Download -->
                <span>Baixar cadastro</span>
            </button>
        </div>
    </div>

    <script>
        // Verifica se o Firebase foi inicializado corretamente
        firebase.auth().onAuthStateChanged(function(user) {
            if (user) {
                console.log('Usuário autenticado:', user.email);
            } else {
                alert('Você precisa estar logado para utilizar esta função.');
                window.location.href = 'login.html';
            }
        });

        // Função para gerar e baixar o arquivo JSON
        async function gerarEbaixarJSON() {
            const user = firebase.auth().currentUser;
            if (!user) {
                alert('Você precisa estar logado para exportar os dados.');
                return;
            }

            const userEmail = user.email;
            const produtosRef = firestore.collection('produtos').where('IDcliente', '==', userEmail);

            try {
                const snapshot = await produtosRef.get();
                if (snapshot.empty) {
                    alert('Nenhum produto encontrado.');
                    return;
                }

                // Cria um array para os dados do JSON
                const dados = [];
                snapshot.forEach((doc) => {
                    const produto = doc.data();
                    dados.push({
                        Nome: produto.nome,
                        Codigo_Barras: produto.codigoInterno,
                        Preco_Custo: produto.precoCusto,
                        Preco_Venda: produto.precoVenda,
                        Grupo: produto.grupo,
                        Quantidade: produto.quantidade,
                        Unidade: produto.unidade,
                        Fracionado: produto.fracionado ? "Sim" : "Não"
                    });
                });

                // Converte os dados para JSON
                const json = JSON.stringify(dados, null, 2);

                // Cria um blob com os dados em formato JSON
                const blob = new Blob([json], { type: 'application/json' });

                // Cria um link temporário para download
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'produtos.json';

                // Adiciona o link temporário ao DOM e aciona o download
                document.body.appendChild(link);
                link.click();

                // Remove o link temporário após o download
                document.body.removeChild(link);

                alert('Download iniciado com sucesso!');
            } catch (error) {
                console.error('Erro ao buscar dados:', error);
            }
        }

        // Associa a função ao botão de download
        document.getElementById('download-json').addEventListener('click', gerarEbaixarJSON);
    </script>

</body>

</html>
